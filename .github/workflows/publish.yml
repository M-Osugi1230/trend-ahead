name: Publish Trend Ahead
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect trend candidates"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'build_site.py'
      - 'announced_windows.py'
      - 'data/announced_windows.json'
      - 'signal_engine.py'
      - 'web/**'
      - 'data/upcoming.json'
      - '.github/workflows/publish.yml'
  schedule:
    - cron: '12 * * * *'
permissions:
  contents: read
concurrency:
  group: trend-ahead-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLISH_READY: ${{ vars.PUBLISH_READY }}
          OPERATOR_CONTACT: ${{ vars.OPERATOR_CONTACT }}
        run: |
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          python build_site.py --site-url "$SITE_URL" --output dist
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed page is reachable
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location \
               --retry 5 --retry-all-errors --retry-delay 3 \
               --max-time 15 "$PAGE_URL" -o /tmp/trend-ahead-index.html
          grep -q 'Trend Ahead' /tmp/trend-ahead-index.html
          curl --fail --silent --show-error --location \
               --retry 3 --retry-all-errors --retry-delay 3 \
               --max-time 15 "${PAGE_URL%/}/health.json" -o /tmp/trend-ahead-health.json
          python -c "import json; r=json.load(open('/tmp/trend-ahead-health.json')); assert r['schema_version']==1 and r['built_at'] and r['collection']['status'] in ('not_started','stale','degraded','ok'); print('Deployed collection status:',r['collection']['status'])"


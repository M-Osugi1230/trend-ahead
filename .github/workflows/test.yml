name: Test collector
on:
  push:
    paths:
      - "collector.py"
      - "forecast_ledger.py"
      - "collection_health.py"
      - "pipeline_guard.py"
      - ".github/workflows/watchdog.yml"
      - "backtest.py"
      - "outreach.py"
      - "event_audit.py"
      - "event_discovery.py"
      - "official_coverage.py"
      - "event_change_monitor.py"
      - "youtube_upcoming.py"
      - "data/youtube_channels.json"
      - "review_apply.py"
      - "data/event_sources.json"
      - ".github/workflows/research-outreach.yml"
      - "signal_engine.py"
      - "build_site.py"
      - "announced_windows.py"
      - "announcement_check.py"
      - "data/announced_windows.json"
      - "web/**"
      - "data/upcoming.json"
      - "sources.json"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/assets/app.js && node tests/test_future_filters.js


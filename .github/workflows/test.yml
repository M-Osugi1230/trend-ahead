name: Test collector
on:
  push:
    paths:
      - "collector.py"
      - "backtest.py"
      - "outreach.py"
      - ".github/workflows/research-outreach.yml"
      - "signal_engine.py"
      - "build_site.py"
      - "web/**"
      - "data/upcoming.json"
      - "sources.json"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v


name: Prepare research and outreach review pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest.py'
      - 'trend_learning.py'
      - 'forecast_ledger.py'
      - 'collection_health.py'
      - 'pipeline_guard.py'
      - 'data/verified_trend_cases_2025.json'
      - 'outreach.py'
      - 'event_audit.py'
      - 'event_discovery.py'
      - 'official_coverage.py'
      - 'event_change_monitor.py'
      - 'announcement_check.py'
      - 'data/announced_windows.json'
      - 'youtube_upcoming.py'
      - 'data/youtube_channels.json'
      - 'data/event_sources.json'
      - 'data/upcoming.json'
      - '.github/workflows/research-outreach.yml'
  schedule:
    # Daily 07:15 JST. GitHub schedule execution can be delayed or skipped.
    - cron: "15 22 * * *"
permissions:
  contents: read
jobs:
  research-and-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research-only retrospective evaluation
        run: python backtest.py --output reports/backtest.json
      - name: Audit actual historic trend outcomes and collected RSS growth
        run: python trend_learning.py --json-output reports/trend-learning.json --markdown-output reports/trend-learning.md
      - name: Evaluate issued forecasts without future data leakage
        run: python forecast_ledger.py evaluate --data-dir data --output reports/forecast-evaluation.json
      - name: Check actual RSS collection schedule and rate limits
        run: python collection_health.py --data-dir data --output reports/collection-health.json
      - name: Audit collection and prospective-forecast pipeline health
        run: python pipeline_guard.py --data-dir data --json-output reports/pipeline-health.json --markdown-output reports/pipeline-health.md
      - name: Restore prior official-event observation snapshot
        uses: actions/cache/restore@v4
        with:
          path: reports/event-snapshot.json
          key: event-monitor-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            event-monitor-v1-${{ github.ref_name }}-
      - name: Discover official events for editorial review only
        run: python event_discovery.py --json-output reports/event-candidates.json --review-output reports/event-review.md
      - name: Audit officially observed events not in approved calendar
        run: python official_coverage.py --discovery reports/event-candidates.json --curated data/upcoming.json --sources data/event_sources.json --json-output reports/official-coverage.json --review-output reports/official-coverage.md
      - name: Compare calendar listings without assuming cancellations
        run: |
          python event_change_monitor.py --current reports/event-candidates.json --previous reports/event-snapshot.json --snapshot-out reports/event-snapshot.json --report-out reports/event-changes.json --review-out reports/event-changes.md
      - name: Save official-event observation snapshot for next run
        uses: actions/cache/save@v4
        with:
          path: reports/event-snapshot.json
          key: event-monitor-v1-${{ github.ref_name }}-${{ github.run_id }}
      - name: Discover approved-channel YouTube livestreams (opt-in only)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_upcoming.py --channels data/youtube_channels.json --output reports/youtube-candidates.json --review-output reports/youtube-review.md
      - name: Recheck official month-only announcements (review only)
        run: python announcement_check.py --catalog data/announced_windows.json --output reports/announcement-check.json --review-output reports/announcement-check.md
      - name: Review event catalog freshness and coverage
        run: python event_audit.py --output reports/event-audit.json
      - name: Create review-only Japanese outreach drafts
        run: python outreach.py --site-url "https://m-osugi1230.github.io/trend-ahead" --output reports/outreach.md
      - name: Show sample sufficiency, not invented accuracy
        run: |
          python -c "import json; p=json.load(open('reports/backtest.json')); print({k:p[k] for k in ('status','labeled_cases','days_with_labels','missing_future_outcomes')})"
      - name: Show realized-outcome research and collection lag
        run: |
          python -c "import json; r=json.load(open('reports/trend-learning.json')); s=r['rss_observations']; print({k:s[k] for k in ('topic_count','growth_observed','insufficient_observations','collection_freshness','collection_lag_hours')})"
      - name: Show prospective forecast evaluation and ingest reliability
        run: |
          python -c "import json; r=json.load(open('reports/forecast-evaluation.json')); print({k:r[k] for k in ('status','issued_forecasts','mature_labeled','pending','missing_future')})"
          python -c "import json; r=json.load(open('reports/collection-health.json')); print({k:r[k] for k in ('status','observed_run_records_24h','minutes_since_last_run','runs_with_429_24h')})"
      - name: Show discovery queue and failed sources
        run: |
          python -c "import json; a=json.load(open('reports/event-candidates.json')); print({k:a[k] for k in ('status','sources_ok','sources_total','queued')}); print(a['sources'])"
      - name: Show independent pipeline freshness and forecast-issue audit
        run: |
          python -c "import json; r=json.load(open('reports/pipeline-health.json')); print({'status': r['status'], 'forecast_audit': r['forecast_audit']['state'], 'lag_min': r['collection']['minutes_since_last_run']})"
      - name: Show official discovery-to-catalog gap coverage
        run: |
          python -c "import json; p=json.load(open('reports/official-coverage.json')); print({k:p[k] for k in ('status','sources_parseable','official_events_observed','already_in_approved_calendar','unlisted_official_candidates','possible_duplicates')})"
      - name: Show 30-day event coverage
        run: |
          python -c "import json; a=json.load(open('reports/event-audit.json')); print({k:a[k] for k in ('status','total_curated','future_7_days','future_30_days','target_30_days','missing_categories_30d')})"
      - name: Archive output for human editorial review
        uses: actions/upload-artifact@v4
        with:
          name: trend-ahead-research-outreach
          path: reports/
          retention-days: 14
